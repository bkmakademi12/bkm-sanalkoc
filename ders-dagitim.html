<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BKM Ders Dağıtım</title>
<style>
:root{--zem:#f3f5f9;--kart:#fff;--yazi:#1b2433;--mut:#6b7689;--cizgi:#e2e7ef;--ana:#1f3b64;--ana2:#2d5a96;--vurgu:#f08a24;--yes:#2e9d6a;--tur:#e59a1a;--kir:#d64545;--r:10px;--golge:0 1px 2px rgba(16,32,64,.06),0 2px 8px rgba(16,32,64,.05)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--yazi);background:var(--zem);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
header.ust{height:56px;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--ana);color:#fff;position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.logo i{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--vurgu);font-style:normal;font-size:15px}
.logo small{display:block;font-weight:400;opacity:.7;font-size:11px;line-height:1}
header select{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:6px 8px;max-width:300px}
header select option{color:#000}
.kayit{font-size:12px;opacity:.75;margin-left:auto;white-space:nowrap}.kayit.err{color:#ffb4b4;opacity:1}
.ustbtn{display:flex;gap:6px}.ustbtn button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.ustbtn button:hover{background:rgba(255,255,255,.22)}
.duzen{display:flex;height:calc(100% - 56px)}body:has(>.onizleme) .duzen{height:calc(100% - 100px)}
nav#nav{width:236px;flex:none;background:#fff;border-right:1px solid var(--cizgi);padding:12px 10px;overflow:auto}
nav#nav button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left;color:#384356;margin-bottom:2px}
nav#nav button:hover{background:#f1f4f9}
nav#nav button.akt{background:#e8eef8;color:var(--ana);font-weight:600}
nav#nav .no{width:20px;height:20px;border-radius:50%;background:#eef1f6;display:grid;place-items:center;font-size:11px;color:var(--mut);flex:none}
nav#nav .akt .no{background:var(--ana);color:#fff}
nav#nav .ik{width:18px;text-align:center}
nav#nav .ad{flex:1}
nav#nav .say{font-size:11px;color:var(--mut);background:#f1f4f9;border-radius:10px;padding:0 7px}
nav#nav .say:empty{display:none}
main#main{flex:1;overflow:auto;padding:22px 28px 60px}
h1{font-size:22px;margin:0 0 4px;color:var(--ana)}
h2{font-size:15px;margin:0 0 12px}
h3{margin:0 0 10px;font-size:17px}
h4{margin:16px 0 8px;font-size:13px;color:#384356}
h4 small,h2 small{font-weight:400;color:var(--mut)}
.alt{color:var(--mut);margin:0 0 16px;max-width:900px}
.ipucu{color:var(--mut);font-size:12.5px;margin:6px 0}
.mut{color:var(--mut)}
code{background:#eef2f8;padding:1px 5px;border-radius:4px;font-size:12px}
.kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:var(--r);padding:16px 18px;margin-bottom:16px;box-shadow:var(--golge)}
.kart.p0{padding:0}
.kart.bos,.bos{color:var(--mut);text-align:center;padding:26px}
.kart.tehlike{border-color:#f2d3d3}
.kaydir{overflow:auto}
label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:#4a5568;font-weight:500}
label.inl{flex-direction:row;align-items:center;gap:8px}
input,select,textarea{border:1px solid #cfd7e3;border-radius:7px;padding:7px 9px;background:#fff;min-width:0;width:100%;outline:none;transition:border .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--ana2);box-shadow:0 0 0 3px rgba(45,90,150,.12)}
input[type=checkbox]{width:auto;accent-color:var(--ana)}
input[type=color]{padding:2px;height:32px;width:42px;cursor:pointer}
textarea{resize:vertical}
.izg2,.izg3,.izg4{display:grid;gap:12px;margin-bottom:10px}
.izg2{grid-template-columns:repeat(2,minmax(0,1fr))}.izg3{grid-template-columns:repeat(3,minmax(0,1fr))}.izg4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.satir{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.arac{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.arac select{width:auto}
.bosluk{flex:1}
.sag{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{border:1px solid #cfd7e3;background:#fff;border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:500;white-space:nowrap;transition:background .15s,border .15s}
.btn:hover{background:#f3f6fa;border-color:#b9c4d4}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ana{background:var(--ana);border-color:var(--ana);color:#fff}.btn.ana:hover{background:var(--ana2)}
.btn.kirmizi{color:var(--kir);border-color:#efc4c4}.btn.kirmizi:hover{background:#fdf1f1}
.btn.kucuk{padding:4px 9px;font-size:12.5px}
.btn.buyuk{padding:11px 20px;font-size:15px}
.ibtn{border:0;background:none;cursor:pointer;color:var(--mut);padding:4px 8px;border-radius:6px;font-size:14px}
.ibtn:hover{background:#f1f4f9;color:var(--kir)}
.chip{flex-direction:row;align-items:center;gap:6px;display:inline-flex;border:1px solid var(--cizgi);border-radius:20px;padding:4px 11px 4px 8px;margin:0 6px 6px 0;font-weight:500;cursor:pointer;background:#fff}
.chip:has(input:checked){background:#e8eef8;border-color:#b9cbe6;color:var(--ana)}
.chk{flex-direction:row;align-items:flex-start;gap:8px;margin:8px 0;font-weight:400;color:var(--yazi)}.chk input{margin-top:3px}
.gunsec{margin-bottom:12px}
.saatler{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.saatler span{background:#f3f6fa;border:1px solid var(--cizgi);border-radius:6px;padding:3px 8px;font-size:12.5px}
.saatler .ogle{background:#fff4e6;border-color:#f6d7ae;color:#9a5a12}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--cizgi);background:#fafbfd;white-space:nowrap}
.tbl td{padding:6px 12px;border-bottom:1px solid #eef1f5;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td input,.tbl td select{padding:5px 8px}
.nw{white-space:nowrap}
.nokta{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px}
.rozet{font-size:10.5px;background:#e6f4ec;color:#2b7a52;border-radius:10px;padding:1px 7px;margin-left:6px;white-space:nowrap}
.kirmiziy{color:var(--kir);font-weight:700}.turuncuy{color:var(--tur);font-weight:700}.yesily{color:var(--yes)}
.sekme{display:flex;gap:4px;border-bottom:1px solid var(--cizgi);margin:6px 0 16px;overflow:auto}
.sekme button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:500}
.sekme button.akt{color:var(--ana);border-bottom-color:var(--ana)}
/* matris */
table.mat{border-collapse:separate;border-spacing:0;min-width:100%}
.mat th,.mat td{border-bottom:1px solid #eef1f5;border-right:1px solid #f1f3f7;padding:5px;text-align:center;vertical-align:top}
.mat thead th{background:#fafbfd;position:sticky;top:0;z-index:2;font-size:12px;min-width:118px}
.mat thead tr.hepsi th{top:52px;background:#f4f7fb}
.mat thead tr.hepsi input{padding:3px 6px;font-size:12px;text-align:center}
.mat .dad{font-weight:700;font-size:13px}
.mat th small{display:block;color:var(--mut);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.mat .yap{position:sticky;left:0;background:#fff;z-index:1;text-align:left;min-width:80px;font-weight:600;padding-left:12px}
.mat thead .yap{z-index:3;background:#fafbfd}
.mc{display:flex;flex-direction:column;gap:3px}
.mc input{text-align:center;padding:3px 4px;font-weight:600}
.mc select{font-size:11.5px;padding:2px 3px}
.mat td.top{vertical-align:middle;font-size:15px}
.ozel{margin-top:3px;font-size:10.5px;border:1px dashed #b9c4d4;background:#fff;border-radius:6px;padding:1px 6px;cursor:pointer;color:var(--ana2)}
.yukl{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px 22px}
.yk{display:grid;grid-template-columns:1fr 90px 54px;gap:8px;align-items:center;font-size:12.5px}
.yk span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yk b{text-align:right}
.bar{height:7px;background:#eef1f5;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;border-radius:5px;background:var(--ana2);transition:width .3s}
/* modal */
#modal{display:none;position:fixed;inset:0;z-index:50}
.mbg{position:absolute;inset:0;background:rgba(15,25,45,.45)}
.mkut{position:relative;margin:6vh auto;background:#fff;border-radius:14px;max-width:520px;width:calc(100% - 24px);max-height:88vh;overflow:auto;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mkut.genis{max-width:820px}
.cokl{max-height:210px;overflow:auto;border:1px solid var(--cizgi);border-radius:8px;padding:8px 8px 2px}
.svg{margin-bottom:4px}.svg>.btn{margin:0 6px 6px 0}
.sbt{display:grid;grid-template-columns:150px 1fr 1fr;gap:8px;align-items:center;margin-bottom:6px;font-size:12.5px}
/* kapalı ızgara */
table.kg{border-collapse:separate;border-spacing:3px;margin:8px auto;user-select:none;touch-action:none}
.kg th{font-size:11.5px;color:var(--mut);padding:2px 6px;cursor:pointer;font-weight:600}
.kg th small{display:block;font-weight:400;font-size:10px}
.kg td{width:58px;height:30px;background:#e8f5ee;border-radius:5px;cursor:pointer;border:1px solid #cfe8da}
.kg td.kap{background:#f8d7d7;border-color:#eeb4b4;background-image:repeating-linear-gradient(45deg,transparent 0 5px,rgba(214,69,69,.15) 5px 10px)}
/* uyarılar */
.uyarilar{border-radius:8px;padding:10px 12px;font-size:13px;margin-top:6px}
.uyarilar>div{padding:2px 0}
.uyarilar.hata{background:#fdf1f1;border:1px solid #f2cccc;color:#8a2626}
.uyarilar.ok{background:#eef8f2;border:1px solid #cbe9d7;color:#24654a}
.uyarilar.uyr{background:#fff8ea;border:1px solid #f4dfb4;color:#7a5512}
.uyarilar summary{cursor:pointer;font-weight:600}
.ozet4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.ozet4>div{background:#fff;border:1px solid var(--cizgi);border-radius:var(--r);padding:12px 14px;box-shadow:var(--golge)}
.kart .ozet4>div{box-shadow:none;background:#fafbfd}
.ozet4 b{display:block;font-size:22px;color:var(--ana)}
.ozet4 span{color:var(--mut);font-size:12px}
.ilerleme{margin-top:14px}.ilerleme .bar{height:10px;margin-bottom:6px}.ilerleme .bar i{width:0;background:linear-gradient(90deg,var(--ana2),var(--vurgu))}
/* program */
.prgarac select{min-width:160px}
.prgw{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px;align-items:start}
.prgbas{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--cizgi)}
.prgbas b{font-size:17px;color:var(--ana)}
table.prg{width:100%;border-collapse:collapse;table-layout:fixed}
.prg th{background:#fafbfd;font-size:12.5px;padding:8px 4px;border-bottom:1px solid var(--cizgi);color:#384356}
.prg th.sa{width:64px;font-weight:400;color:var(--mut)}
.prg th.sa b{display:block;color:var(--yazi);font-size:14px}
.prg th.sa small{font-size:10.5px;line-height:1.2;display:block}
.prg td{border:1px solid #eef1f5;padding:3px;height:62px;vertical-align:top;position:relative}
.prg td.kapc{background:repeating-linear-gradient(45deg,#fafafa 0 6px,#f1f1f1 6px 12px)}
.prg tr.ogleR td{height:auto;padding:3px;text-align:center;background:#fff7ec;color:#9a5a12;font-size:11.5px;font-weight:600;letter-spacing:.5px}
.krt{border-left:4px solid #999;border-radius:6px;padding:4px 7px;font-size:12px;line-height:1.25;cursor:grab;position:relative;margin-bottom:2px;overflow:hidden;min-height:52px}
.krt b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.krt span{display:block;color:#4a5568;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px}
.krt em{display:block;font-style:normal;font-size:10.5px;color:var(--mut)}
.krt.dev{opacity:.85;border-top:1px dashed rgba(0,0,0,.12)}
.krt.ortk{outline:1px dashed rgba(0,0,0,.18);outline-offset:-2px}
.krt .pn{position:absolute;right:4px;top:3px;font-style:normal;font-size:11px}
.krt.secili{box-shadow:0 0 0 2px var(--vurgu);z-index:2}
td.d-ok{background:#dff5e7!important;box-shadow:inset 0 0 0 2px #5fc086;cursor:pointer}
td.d-cf{background:#fff6f4!important;box-shadow:inset 0 0 0 1px #f3b8ae;cursor:pointer}
td.d-blk{background:#f1f1f1!important}
.selbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;background:#fff6ea;border:1px solid #f6d7ae;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px;position:sticky;top:-22px;z-index:5}
.tepsi{background:#fff;border:1px solid var(--cizgi);border-radius:var(--r);padding:12px;max-height:75vh;overflow:auto;box-shadow:var(--golge);position:sticky;top:0}
.tepsi h4{margin:0 0 8px}
.krt.tp{min-height:0;margin-bottom:6px;cursor:pointer}
table.crs{border-collapse:collapse;font-size:11px}
.crs th,.crs td{border:1px solid #e6eaf0;padding:2px 3px;text-align:center;min-width:42px}
.crs td{height:34px;line-height:1.1}
.crs td b{display:block;font-size:11px}.crs td small{font-size:9.5px;color:#4a5568}
.crs .gb{border-left:2px solid #9fb0c8}
.crs thead th{background:#fafbfd;position:sticky;top:0}
.crs .yap{position:sticky;left:0;background:#fff;text-align:left;padding:2px 8px;white-space:nowrap;z-index:1}
.crs .yap a{cursor:pointer;color:var(--ana2)}
/* toast */
#toast{position:fixed;right:18px;bottom:18px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:380px}
.tst{background:#24324a;color:#fff;padding:10px 14px;border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.18);font-size:13px;transition:opacity .4s,transform .4s}
.tst.ok{background:#20694a}.tst.hata{background:#a43434}.tst.uyari{background:#9a6412}
.tst.git{opacity:0;transform:translateY(8px)}
#yazdir{display:none}
.onizleme{display:flex;gap:10px;justify-content:space-between;align-items:center;background:#eef4ff;border:1px solid #c9d9f3;color:#284a7a;border-radius:8px;padding:8px 12px;margin-bottom:14px;font-size:12.5px}.onizleme button{border:0;background:none;cursor:pointer;color:inherit}
@media (max-width:900px){
  .duzen{flex-direction:column;height:auto}
  nav#nav{width:auto;display:flex;overflow-x:auto;padding:6px;border-right:0;border-bottom:1px solid var(--cizgi);position:sticky;top:56px;z-index:10}
  nav#nav button{width:auto;flex:none;margin:0 2px}
  nav#nav .ad{white-space:nowrap}
  main#main{padding:16px 12px 60px;overflow:visible}
  .prgw{grid-template-columns:1fr}
  .ozet4{grid-template-columns:repeat(2,1fr)}
  .izg2,.izg3{grid-template-columns:1fr}
  header.ust{gap:8px;padding:0 10px}.logo small,.kayit{display:none}
  header select{max-width:150px}
  .ustbtn button span{display:none}
  .prg td{height:54px}.krt{min-height:46px}
}
/* yazdırma */
@media print{
  body>*:not(#yazdir){display:none!important}
  #yazdir{display:block!important}
  body{background:#fff}
  .ysay{page-break-after:always;padding:0}
  .ysay:last-child{page-break-after:auto}
  .yb{display:flex;justify-content:space-between;font-size:11px;color:#555;border-bottom:2px solid #1f3b64;padding-bottom:4px;margin-bottom:8px}
  .ysay h2{text-align:center;font-size:17px;margin:6px 0 10px}
  .prg.yz td{height:58px}
  .prg.yz .krt{min-height:0;border-left-width:3px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .crs td,.prg td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.lst{margin-top:10px;font-size:11px;border-collapse:collapse}
  table.lst td{padding:2px 10px;border-bottom:1px solid #ddd}
  @page{size:A4 portrait;margin:12mm}
  body.yatayB{zoom:.72}
}
</style>
</head>
<body>
<header class="ust">
  <div class="logo"><i>📅</i><div>BKM Ders Dağıtım<small>Ders programı hazırlama</small></div></div>
  <select id="kurumSec" title="Şube"></select>
  <span id="kayit" class="kayit"></span>
  <div class="ustbtn">
    <button data-act="kmal" title="Kurs Modülü'ndeki şube, ders ve öğretmenleri al">🏫<span> Kurs Modülü'nden al</span></button>
    <button data-act="ornek" title="Örnek veri yükle">🧪<span> Örnek veri</span></button>
    <button data-act="iceaktar" title="JSON yedeğini içe aktar">⇡<span> İçe aktar</span></button>
    <button data-act="disaktar" title="JSON yedeği indir">⇣<span> Yedek al</span></button>
  </div>
  <input type="file" id="dosya" accept=".json,application/json" hidden>
</header>
<div class="duzen"><nav id="nav"></nav><main id="main"></main></div>
<div id="modal"></div>
<div id="toast"></div>
<div id="yazdir"></div>
<script id="core">
/* ===== DERS DAĞITIM ÇEKİRDEĞİ (hem ana sayfada hem Web Worker'da çalışır) ===== */
var DDCore = (function () {
  'use strict';

  function rngOf(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function parseBloklar(str, saat) {
    saat = +saat || 0;
    if (str) {
      var p = String(str).split(/[+,\s]+/).map(function (x) { return parseInt(x, 10); }).filter(function (x) { return x > 0; });
      var sum = p.reduce(function (a, b) { return a + b; }, 0);
      if (sum === saat && p.length) return p;
    }
    var r = [], k = saat;
    while (k >= 2) { r.push(2); k -= 2; }
    if (k) r.push(1);
    return r;
  }

  var VARSAYILAN_AGIRLIK = { tGap: 4, tGapX: 25, tDay: 1, tFree: 40, cGap: 60, cLate: 25, cBal: 3, pref: 6 };

  /* ---------- Model kurulumu ---------- */
  function build(st, opts) {
    opts = opts || {};
    var A = st.ayar;
    var D = A.gunler.length, H = +A.saatSayisi, T = D * H;
    var W = Object.assign({}, VARSAYILAN_AGIRLIK, opts.agirlik || {});
    var warnings = [];

    function idxMap(arr) { var m = {}; arr.forEach(function (x, i) { m[x.id] = i; }); return m; }
    var cI = idxMap(st.siniflar), tI = idxMap(st.ogretmenler), rI = idxMap(st.derslikler || []);
    var nC = st.siniflar.length, nT = st.ogretmenler.length, nR = (st.derslikler || []).length;

    function mask(kapali) {
      var m = new Uint8Array(T);
      if (kapali) for (var k in kapali) {
        if (!kapali[k]) continue;
        var p = k.split('-'), g = +p[0], s = +p[1];
        if (g < D && s < H) m[g * H + s] = 1;
      }
      return m;
    }
    var unC = st.siniflar.map(function (c) { return mask(c.kapali); });
    var unT = st.ogretmenler.map(function (t) { return mask(t.kapali); });
    var unR = (st.derslikler || []).map(function (r) { return mask(r.kapali); });
    var tMax = st.ogretmenler.map(function (t) { return Math.min(H, +t.maxGunluk || H); });

    var vid = varliklar(gor)[idx]; if (!vid) return cells;
    M.units.forEach(function (U) {
      var t = M.pos[U.id]; if (t < 0) return;
      var ilgili = false;
      if (gor === 'sinif' || gor === 'carsaf') ilgili = U.classes.indexOf(M.cI[vid.id]) >= 0;
      else if (gor === 'ogretmen' || gor === 'carsafO') ilgili = U.teachers.indexOf(M.tI[vid.id]) >= 0 || U.cards.some(function (c) { var a = find(ST.atamalar, c.aid); return a && a.ogretmenIds.indexOf(vid.id) >= 0; });
      else if (gor === 'derslik') ilgili = M.rooms[U.id].indexOf(M.rI[vid.id]) >= 0;
      if (!ilgili) return;
      var g = (t / H) | 0, s = t % H;

      case 'hepsinisil': ask('Bu şubenin TÜM verisi (dersler, sınıflar, öğretmenler, atamalar, program) silinecek. Önce JSON yedeği almanız önerilir. Emin misiniz?', function () { ST = bosVeri(); save(); render(); }, 'Hepsini sil'); break;
      case 'dersekle': ST.dersler.push({ id: uid('d'), ad: 'Yeni ders', kisa: '', renk: PALET[ST.dersler.length % PALET.length] }); save(); render(); break;
      case 'dersmeb':

      case 'otoogr':
        var yk = ogrYuk(), n3 = 0;

      case 'dagit': dagit(); break;
      case 'dagdur': if (WORK) { WORK.terminate(); WORK = null; } toast('Dağıtım durduruldu.', 'uyari'); render(); break;
      case 'gor': UI.gorunum = v; UI.varlik = 0; UI.sel = -1; render(); break;
      case 'vonce': UI.varlik = Math.max(0, UI.varlik - 1); render(); break;
      case 'vsonra': UI.varlik = Math.min(varliklar(UI.gorunum).length - 1, UI.varlik + 1); render(); break;
      case 'carsafgit': UI.gorunum = UI.gorunum === 'carsafO' ? 'ogretmen' : 'sinif'; UI.varlik = +b.getAttribute('data-i'); render(); break;
      case 'secbirak': UI.sel = -1; render(); break;
      case 'pin': var M = eng(); M.pinned[UI.sel] = M.pinned[UI.sel] ? 0 : 1; if (M.pos[UI.sel] < 0) M.pinned[UI.sel] = 0; ST.yerlesim = DDCore.exportPlacements(M); save(true); render(); break;
      case 'kenara': var M2 = eng(); M2.pinned[UI.sel] = 0; DDCore.remove(M2, UI.sel); ST.yerlesim = DDCore.exportPlacements(M2); save(true); render(); break;
      case 'pinlerikaldir': var M3 = eng(); M3.pinned.fill(0); ST.yerlesim = DDCore.exportPlacements(M3); save(true); render(); toast('Tüm sabitlemeler kaldırıldı.', 'ok'); break;
      case 'yazdir': yazdir(v); break;
      case 'excel': excel(); break;
      case 'kmal':
        var P = null; try { P = GOMULU && window.parent.kmDDData ? window.parent.kmDDData() : null; } catch (e) { }
        if (!P) { toast('Şube verisine ulaşılamadı. index.html ve sw.js dosyalarını da GitHub’a yükleyip sayfayı Ctrl+Shift+R ile yenileyin.', 'hata'); break; }
        var sbl = P.subeler.filter(function (b) { var kk = kurumKodu(b.kurum); return !kk || kk === kurum; });
        if (!sbl.length) { toast('Bu kuruma ait aktif şube bulunamadı.', 'uyari'); break; }
        ask(sbl.length + ' şube Kurs Modülü’nden alınacak (sınıf, ders, öğretmen ve ders atamaları). Mevcut kayıtlar korunur, yalnızca yeniler eklenir. Devam edilsin mi?', function () { kmAktar(sbl); }, 'Evet, al');
        break;
      case 'ytest': fbIstek('GET', yayinYolu(), undefined, 'shallow=true').then(function () { toast('Bağlantı başarılı ✓', 'ok'); }).catch(function (er) { toast('Bağlanılamadı: ' + er.message, 'hata'); }); break;
      case 'yayinla':
        var veri = yayinVerisi();
        if (!Object.keys(ST.yerlesim).length) { toast('Yayınlanacak program yok. Önce dağıtım yapın.', 'hata'); return; }
        $('#ysonuc').innerHTML = '<p class="mut">Gönderiliyor…</p>';
        fbIstek('PUT', yayinYolu(), veri).then(function () {
          $('#ysonuc').innerHTML = '<div class="uyarilar ok"><div>✓ ' + Object.keys(veri.siniflar).length + ' sınıf ve ' + Object.keys(veri.ogretmenler).length + ' öğretmen programı <code>' + esc(yayinYolu()) + '</code> yoluna yayınlandı (' + esc(veri.meta.guncellemeMetin) + ').</div></div>';
          toast('Program Sanal Etüt’e yayınlandı ✓', 'ok');
        }).catch(function (er) { $('#ysonuc').innerHTML = '<div class="uyarilar hata"><div>Yayınlanamadı: ' + esc(er.message) + '. Bu sayfa Claude önizlemesinde açıksa tarayıcı dış bağlantıyı engeller; dosyayı kendi sitenizde (Vercel) açıp tekrar deneyin. Ya da JSON’u indirip Firebase konsolundan içe aktarın.</div></div>'; }); break;
      case 'yayinsil': ask('Bu şubenin yayınlanmış programı Sanal Etüt’ten kaldırılsın mı?', function () { fbIstek('DELETE', yayinYolu()).then(function () { toast('Yayından kaldırıldı.', 'ok'); }).catch(function (er) { toast('Hata: ' + er.message, 'hata'); }); }); break;
      case 'jsonyayin': indir('ders-programi-' + kurum + '.json', JSON.stringify(yayinVerisi(), null, 2), 'application/json'); break;
      case 'portalsinif': if (GOMULU) { kmSinifAl(); break; } portaldanAl('sinif'); break;
      case 'kmsinif': kmSinifAl(); break;
      case 'portalogr': if (GOMULU) { kmOgrAl(); break; } portaldanAl('ogretmen'); break;
      case 'kmogr': kmOgrAl(); break;
      case 'ornek': ask('Bu şubeye örnek veri yüklensin mi? Mevcut veri silinir.', function () { ST = normalize(ddOrnekVeri()); save(); git('atama'); toast('Örnek veri yüklendi. “Dağıtım” sayfasından dağıtabilirsiniz.', 'ok'); }); break;
      case 'disaktar': indir('ders-dagitim-' + kurum + '-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify({ kurum: kurum, veri: ST }, null, 1), 'application/json'); break;
      case 'iceaktar': $('#dosya').click(); break;
    }
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.id === 'kurumSec') { save(); kurum = el.value; LS.set('dd_kurum', kurum); ST = normalize(LS.get('dd_veri_' + kurum)); ENG = null; UI.sel = -1; render(); toast(kurumAd() + ' açıldı.', 'ok'); return; }
    if (el.id === 'dosya') {
      var f = el.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () { try { var j = JSON.parse(r.result); var veri = j.veri || j; if (!veri.ayar) throw new Error('Geçersiz dosya'); ask('Dosyadaki veri “' + kurumAd() + '” şubesine yüklensin mi? Mevcut veri değiştirilir.', function () { ST = normalize(veri); save(); render(); toast('İçe aktarıldı.', 'ok'); }); } catch (er) { toast('Dosya okunamadı: ' + er.message, 'hata'); } el.value = ''; };
      r.readAsText(f); return;
    }
    var val = el.type === 'checkbox' ? el.checked : el.value;
    var tt = el.getAttribute('data-t'); if (tt === 'n') val = val === '' ? '' : +val; if (tt === 'b') val = !!el.checked;
    if (el.hasAttribute('data-a')) {
      var k = el.getAttribute('data-a'); ST.ayar[k] = val;
      if (k === 'saatSayisi') ST.ayar.saatSayisi = Math.max(1, Math.min(14, +val || 8));
      save(); render(); return;
    }
    if (el.hasAttribute('data-gun')) { var yeni = GUNLER.filter(function (g) { var c = $('[data-gun="' + g + '"]'); return c && c.checked; }); if (!yeni.length) { el.checked = true; return; } remapGunler(yeni); save(); render(); return; }
    if (el.hasAttribute('data-f')) {
      var x = find(ST[el.getAttribute('data-f')], el.getAttribute('data-id')); if (!x) return;
      x[el.getAttribute('data-k')] = val;
      if (el.getAttribute('data-f') === 'ogretmenler' && el.getAttribute('data-k') === 'ad' && !x.kisa) x.kisa = kisaAd(val);
      save(); if (/maxGunluk|brans/.test(el.getAttribute('data-k')) || el.getAttribute('data-k') === 'seviye') render(); return;
    }
    if (el.hasAttribute('data-mc')) {
      var cid = el.getAttribute('data-mc'), did = el.getAttribute('data-md'), h = Math.max(0, parseInt(el.value, 10) || 0), a = basitAtama(cid, did);
      if (h > 0) { if (a) a.saat = h; else { var sel = $('[data-mt="' + cid + '"][data-md="' + did + '"]'); ST.atamalar.push(yeniAtama({ dersId: did, sinifIds: [cid], ogretmenIds: sel && sel.value ? [sel.value] : [], saat: h })); } }
      else if (a) ST.atamalar = ST.atamalar.filter(function (y) { return y !== a; });
      var td = el.closest('td'), d = find(ST.dersler, did); td.className = h ? 'dolu' : ''; td.style.background = h ? hexA(d.renk, 0.10) : '';
      save(); matrisTazele(cid); return;
    }
    if (el.hasAttribute('data-mt')) {
      var cid2 = el.getAttribute('data-mt'), did2 = el.getAttribute('data-md'), a2 = basitAtama(cid2, did2);
      if (a2) a2.ogretmenIds = el.value ? [el.value] : [];
      else if (el.value) ST.atamalar.push(yeniAtama({ dersId: did2, sinifIds: [cid2], ogretmenIds: [el.value], saat: 0 }));
      save(); matrisTazele(cid2); return;
    }
    if (el.hasAttribute('data-mall')) {
      var did3 = el.getAttribute('data-mall'), h3 = Math.max(0, parseInt(el.value, 10) || 0);
      $$('[data-mc][data-md="' + did3 + '"]').forEach(function (inp) { inp.value = h3 || ''; inp.dispatchEvent(new Event('change', { bubbles: true })); });
      el.value = ''; return;
    }
    if (el.getAttribute('data-act') === 'matsev') { UI.matSeviye = el.value; render(); return; }
    if (el.getAttribute('data-act') === 'vsec') { UI.varlik = +el.value; UI.sel = -1; render(); return; }
    if (el.hasAttribute('data-dag')) { if (el.getAttribute('data-dag') === 'sure') UI.dagSure = +el.value; else UI.dagMod = el.value; return; }
    if (el.hasAttribute('data-onc')) { UI.onc[el.getAttribute('data-onc')] = +el.value; return; }
    if (el.hasAttribute('data-y')) { Y[el.getAttribute('data-y')] = String(el.value).trim(); LS.set('dd_yayin', Y); if (UI.sayfa === 'yayin') render(); return; }

      var w = $('#am'), a4 = UI._am; var tmp = { sabit: a4.sabit, saat: +$('[name="saat"]', w).value || 0, bloklar: $('[name="bloklar"]', w).value };
      $('#sabitler').innerHTML = sabitHTML(tmp, DDCore.parseBloklar(tmp.bloklar, tmp.saat), saatler());
    }

  $('#kurumSec').innerHTML = KURUMLAR.map(function (k) { return '<option value="' + k.kod + '"' + (k.kod === kurum ? ' selected' : '') + '>' + k.ad + '</option>'; }).join('');
  render();
  var cerceve = false; try { cerceve = window.self !== window.top; } catch (e) { cerceve = true; }
  if (cerceve && /claude|usercontent|anthropic/i.test(location.hostname + document.referrer)) {
    var nb = document.createElement('div'); nb.className = 'onizleme';
    nb.innerHTML = 'Önizleme modu: yazdırma, Excel/JSON indirme ve Sanal Etüt (Firebase) bağlantısı yalnızca dosyayı kendi sitenizde açtığınızda çalışır. Dağıtım ve düzenleme burada da çalışır.<button aria-label="Kapat">✕</button>';
    nb.querySelector('button').onclick = function () { nb.remove(); };
    nb.style.margin = '8px 12px 0'; document.querySelector('.duzen').before(nb);
  }

  window.DDApp = { state: function () { return ST; }, render: render, git: git, UI: UI, yayinVerisi: yayinVerisi };
})();
